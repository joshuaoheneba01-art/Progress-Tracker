<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stick-to-it Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1320">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stick">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f3f6fb; --card:#ffffff; --text:#0f1b2d; --muted:#5b6b82; --line:#e1e7f1; --accent:#0d9488; --soft:#eef3f9;
  --uni:#7c3aed; --cisco:#0d9488; --thrive:#d97706; --radar:#2563eb; --python:#16a34a; --git:#db2777; --review:#78716c; --rest:#64748b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b1320; --card:#121c2e; --text:#e6ecf5; --muted:#8a9bb4; --line:#22304a; --accent:#2dd4bf; --soft:#182339; }
}
:root[data-theme="dark"]{ --bg:#0b1320; --card:#121c2e; --text:#e6ecf5; --muted:#8a9bb4; --line:#22304a; --accent:#2dd4bf; --soft:#182339; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*{ box-sizing:border-box; }
body{ margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; -webkit-tap-highlight-color:transparent; }
.wrap{ max-width:640px; margin:0 auto; padding:0 14px 48px; }
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); padding:12px 0 8px; }
.row{ display:flex; align-items:center; gap:10px; }
.grow{ flex:1; min-width:0; }
select.btn{ appearance:auto; padding:8px 10px; }
h1{ font-size:19px; margin:0; letter-spacing:-.2px; }
.sub{ color:var(--muted); font-size:12.5px; }
.icon-btn{ border:1px solid var(--line); background:var(--card); color:var(--text); width:34px; height:34px; border-radius:10px; font-size:15px; cursor:pointer; }
.hero{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin:6px 0 12px; }
.hero .big{ font-size:17px; font-weight:700; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
.chip{ background:var(--soft); border:1px solid var(--line); border-radius:99px; padding:3px 10px; font-size:12px; color:var(--muted); }
.chip b{ color:var(--text); }
.tabs{ display:flex; gap:6px; background:var(--soft); padding:4px; border-radius:12px; margin-bottom:12px; }
.tab{ flex:1; border:0; background:transparent; color:var(--muted); padding:8px 2px; border-radius:9px; font:600 13.5px inherit; font-family:inherit; cursor:pointer; }
.tab.on{ background:var(--card); color:var(--text); box-shadow:0 1px 3px rgba(0,0,0,.12); }
.days{ display:flex; gap:5px; margin-bottom:12px; }
.day{ flex:1; border:1px solid var(--line); background:var(--card); border-radius:11px; padding:6px 0 7px; text-align:center; cursor:pointer; color:var(--text); font-family:inherit; }
.day .n{ font-size:11.5px; font-weight:700; color:var(--muted); }
.day .p{ font-size:12px; margin-top:2px; font-weight:700; }
.day.on{ border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
.day.today .n::after{ content:" •"; color:var(--accent); }
.card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:12px; }
.card h3{ margin:0 0 8px; font-size:14px; }
.now{ border-left:4px solid var(--accent); }
.now .k{ font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--accent); font-weight:700; }
.now .v{ font-weight:700; margin-top:2px; }
.blk{ display:flex; align-items:center; gap:11px; background:var(--card); border:1px solid var(--line); border-left:5px solid var(--c); border-radius:12px; padding:11px 12px; margin-bottom:8px; cursor:pointer; user-select:none; }
.blk.cur{ box-shadow:0 0 0 2px var(--accent); }
.chk{ width:26px; height:26px; border-radius:50%; border:2px solid var(--c); display:grid; place-items:center; color:transparent; font-weight:800; flex:0 0 26px; }
.blk.done .chk{ background:var(--c); color:#fff; }
.blk.done .lb{ text-decoration:line-through; opacity:.55; }
.tm{ font-size:12px; color:var(--muted); }
.lb{ font-weight:650; }
.tag{ font-size:11px; font-weight:700; color:var(--c); background:var(--soft); border-radius:99px; padding:2px 8px; }
.rest{ display:flex; gap:8px; align-items:center; color:var(--muted); font-size:12.5px; padding:6px 12px; margin-bottom:8px; border:1px dashed var(--line); border-radius:10px; }
.bars{ display:flex; align-items:flex-end; gap:8px; height:110px; margin-top:4px; }
.bar{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; }
.bar i{ display:block; width:100%; background:var(--accent); border-radius:6px 6px 2px 2px; min-height:3px; opacity:.9; }
.bar span{ font-size:11px; color:var(--muted); margin-top:4px; }
.bar.today span{ color:var(--accent); font-weight:700; }
.cat{ margin-bottom:10px; }
.cat .h{ display:flex; justify-content:space-between; font-size:13px; margin-bottom:4px; }
.track{ height:9px; background:var(--soft); border-radius:99px; overflow:hidden; }
.track i{ display:block; height:100%; background:var(--c); border-radius:99px; }
.counter{ display:flex; align-items:center; gap:14px; }
.counter .num{ font-size:30px; font-weight:800; min-width:48px; text-align:center; }
.btn{ border:1px solid var(--line); background:var(--soft); color:var(--text); border-radius:10px; padding:9px 14px; font:600 14px inherit; font-family:inherit; cursor:pointer; }
.btn.pri{ background:var(--accent); color:#04201d; border-color:var(--accent); }
input,textarea{ width:100%; background:var(--soft); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; margin-bottom:8px; }
textarea{ min-height:64px; resize:vertical; }
.proj{ border-top:1px solid var(--line); padding:10px 0; }
.proj:first-of-type{ border-top:0; }
.proj .t{ font-weight:700; }
.proj .n{ color:var(--muted); font-size:13px; margin-top:2px; white-space:pre-wrap; }
.proj .d{ color:var(--muted); font-size:11.5px; margin-top:3px; }
.link{ background:none; border:0; color:var(--muted); font-size:12px; cursor:pointer; padding:0; text-decoration:underline; font-family:inherit; }
.hist{ display:flex; justify-content:space-between; padding:7px 0; border-top:1px solid var(--line); font-size:13.5px; }
.hist:first-of-type{ border-top:0; }
.foot{ text-align:center; color:var(--muted); font-size:12px; margin-top:16px; }
.done-msg{ text-align:center; padding:12px; border-radius:12px; background:var(--soft); margin-bottom:12px; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="row">
      <div class="grow"><h1>Stick-to-it Tracker</h1><div class="sub" id="dateLine"></div></div>
      <button class="icon-btn" data-a="theme" aria-label="Toggle theme">◐</button>
    </div>
  </div>
  <div id="app"></div>
</div>

<script>
const SCHED = {"MON": [{"s": "13:00", "e": "16:00", "c": "nap", "l": "NAP · 3 hrs"}, {"s": "16:30", "e": "19:30", "c": "uni", "l": "CSC 415 · review"}, {"s": "20:00", "e": "22:00", "c": "cisco", "l": "Cisco JCA · module"}, {"s": "22:00", "e": "24:00", "c": "thrive", "l": "Thrive · weekly task"}, {"s": "24:00", "e": "27:00", "c": "uni", "l": "CSC 413 · practice"}, {"s": "27:00", "e": "27:30", "c": "wind", "l": "Wind down · plan ahead"}], "TUE": [{"s": "08:45", "e": "10:45", "c": "uni", "l": "CSC 405 · prep"}, {"s": "11:00", "e": "13:00", "c": "uni", "l": "CSC 401 · prep"}, {"s": "13:00", "e": "16:00", "c": "nap", "l": "NAP · 3 hrs"}, {"s": "16:30", "e": "18:30", "c": "cisco", "l": "Cisco JCA · module+lab"}, {"s": "19:30", "e": "21:30", "c": "thrive", "l": "Thrive · brief + start"}, {"s": "21:30", "e": "23:30", "c": "cisco", "l": "Cisco · revise + quiz"}, {"s": "23:30", "e": "26:00", "c": "git", "l": "Projects · build"}, {"s": "26:00", "e": "27:00", "c": "python", "l": "Python practice"}, {"s": "27:00", "e": "27:30", "c": "wind", "l": "Wind down · plan ahead"}], "WED": [{"s": "10:15", "e": "12:15", "c": "uni", "l": "CSC 411 · prep"}, {"s": "14:45", "e": "15:45", "c": "nap", "l": "NAP · 1 hr"}, {"s": "19:00", "e": "22:00", "c": "uni", "l": "CSC 401 · review"}, {"s": "22:00", "e": "24:00", "c": "cisco", "l": "Cisco JCA · module+lab"}, {"s": "24:00", "e": "25:00", "c": "python", "l": "Python practice"}, {"s": "25:00", "e": "27:00", "c": "git", "l": "Projects · build"}, {"s": "27:00", "e": "27:30", "c": "wind", "l": "Wind down · plan ahead"}], "THU": [{"s": "10:30", "e": "12:30", "c": "uni", "l": "CSC 413 · prep"}, {"s": "12:30", "e": "15:30", "c": "nap", "l": "NAP · 3 hrs"}, {"s": "15:30", "e": "18:30", "c": "uni", "l": "CSC 411 · review"}, {"s": "19:00", "e": "22:00", "c": "uni", "l": "CSC 405 · review"}, {"s": "22:00", "e": "24:00", "c": "cisco", "l": "Cisco JCA · module+lab"}, {"s": "24:00", "e": "25:30", "c": "git", "l": "Projects · build"}, {"s": "25:30", "e": "27:00", "c": "cisco", "l": "Cisco · revise + quiz"}, {"s": "27:00", "e": "27:30", "c": "wind", "l": "Wind down · plan ahead"}], "FRI": [{"s": "10:00", "e": "12:00", "c": "cisco", "l": "Cisco JCA · module+lab"}, {"s": "15:00", "e": "17:00", "c": "nap", "l": "NAP · 2 hrs"}, {"s": "17:00", "e": "20:00", "c": "uni", "l": "CSC 413 · review"}, {"s": "20:30", "e": "23:30", "c": "uni", "l": "CSC 415 · practice"}, {"s": "23:30", "e": "25:30", "c": "cisco", "l": "Cisco · Packet Tracer lab"}, {"s": "25:30", "e": "27:00", "c": "git", "l": "Projects · build"}, {"s": "27:00", "e": "27:30", "c": "wind", "l": "Wind down · plan ahead"}], "SAT": [{"s": "09:00", "e": "10:00", "c": "git", "l": "Projects · build"}, {"s": "10:00", "e": "13:00", "c": "uni", "l": "CSC 405 · practice"}, {"s": "13:00", "e": "16:00", "c": "nap", "l": "NAP · 3 hrs"}, {"s": "16:00", "e": "18:00", "c": "cisco", "l": "Cisco JCA · module+lab"}, {"s": "18:00", "e": "21:00", "c": "uni", "l": "CSC 411 · practice"}, {"s": "21:30", "e": "23:30", "c": "radar", "l": "UCC Radar · build"}, {"s": "23:30", "e": "25:00", "c": "python", "l": "Python practice"}, {"s": "25:00", "e": "27:00", "c": "cisco", "l": "Cisco · revise + quiz"}, {"s": "27:00", "e": "27:30", "c": "wind", "l": "Wind down · plan ahead"}], "SUN": [{"s": "09:30", "e": "12:30", "c": "uni", "l": "CSC 401 · practice"}, {"s": "13:00", "e": "16:00", "c": "nap", "l": "NAP · 3 hrs"}, {"s": "16:30", "e": "18:30", "c": "cisco", "l": "Cisco JCA · module+lab"}, {"s": "19:30", "e": "21:30", "c": "uni", "l": "CSC 415 · prep"}, {"s": "21:30", "e": "22:30", "c": "review", "l": "Weekly review + plan"}, {"s": "22:30", "e": "24:30", "c": "radar", "l": "UCC Radar · build"}, {"s": "24:30", "e": "26:00", "c": "cisco", "l": "Cisco JCA · get ahead"}, {"s": "26:00", "e": "27:00", "c": "git", "l": "Projects · build"}, {"s": "27:00", "e": "27:30", "c": "wind", "l": "Wind down · plan ahead"}]};
const DAYS=["MON","TUE","WED","THU","FRI","SAT","SUN"];
const DOW=["SUN","MON","TUE","WED","THU","FRI","SAT"];
const CAT={uni:"Uni courses",cisco:"Cisco JCA",thrive:"Thrive",radar:"UCC Radar",python:"Python",git:"Projects",review:"Weekly review"};
const isStudy=c=>c!=="nap"&&c!=="wind";
const H=t=>{const p=t.split(":");return +p[0]+ +p[1]/60;};
const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hm(x){let h=Math.floor(x+1e-9),m=Math.round((x-h)*60);if(m===60){h++;m=0;}const HH=h%24;return{h:HH%12||12,m:m,s:HH<12?"am":"pm"};}
function rng(s,e){const a=hm(H(s)),b=hm(H(e));return a.h+":"+pad(a.m)+(a.s!==b.s?a.s:"")+"–"+b.h+":"+pad(b.m)+b.s;}
function dur(b){return H(b.e)-H(b.s);}
const fmtH=x=>{const r=Math.round(x*10)/10;return (r%1===0?r.toFixed(0):r.toFixed(1));};

function studyDay(now){const d=new Date(now);const h=d.getHours()+d.getMinutes()/60;if(h<3.5)d.setDate(d.getDate()-1);d.setHours(12,0,0,0);return d;}
function mondayOf(d){const x=new Date(d);x.setHours(12,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function nowH(){const n=new Date();const sd=studyDay(n);const h=n.getHours()+n.getMinutes()/60;return ds(n)===ds(sd)?h:h+24;}

const LS="mcjayy_tracker_v1";
let S={weeks:{},projects:[],modules:0};

let tab="day";
const SD=studyDay(new Date());
const curWeek=ds(mondayOf(SD));
const todayKey=DOW[SD.getDay()];
let selDay=todayKey;

function normalize(o){o=o||{};return{weeks:o.weeks||{},projects:Array.isArray(o.projects)?o.projects:[],modules:+o.modules||0};}
try{const raw=localStorage.getItem(LS);if(raw)S=normalize(JSON.parse(raw));}catch(e){}

function prune(){const keys=Object.keys(S.weeks).sort();while(keys.length>40){delete S.weeks[keys.shift()];}}
function persist(){
  prune();
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
}

function wk(){return S.weeks[curWeek]||(S.weeks[curWeek]={});}
function dayStats(weekKey,day){
  const w=S.weeks[weekKey]||{};let tot=0,done=0,hrs={};
  (SCHED[day]||[]).forEach(b=>{if(!isStudy(b.c))return;tot++;if(w[day+"@"+b.s]){done++;hrs[b.c]=(hrs[b.c]||0)+dur(b);}});
  return{tot,done,hrs};
}
function weekStats(weekKey){
  let tot=0,done=0,hrs={};
  DAYS.forEach(d=>{const s=dayStats(weekKey,d);tot+=s.tot;done+=s.done;for(const k in s.hrs)hrs[k]=(hrs[k]||0)+s.hrs[k];});
  return{tot,done,hrs};
}
function planned(){
  let p={};DAYS.forEach(d=>SCHED[d].forEach(b=>{if(isStudy(b.c))p[b.c]=(p[b.c]||0)+dur(b);}));return p;
}
function streak(){
  let n=0;
  for(let i=0;i<400;i++){
    const d=new Date(SD);d.setDate(d.getDate()-i);
    const st=dayStats(ds(mondayOf(d)),DOW[d.getDay()]);
    const ok=st.tot&&st.done/st.tot>=0.6;
    if(ok)n++;else if(i>0)break;
  }
  return n;
}
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);

function ring(p){
  const C=2*Math.PI*26,v=Math.max(0,Math.min(1,p));
  return '<svg width="68" height="68" viewBox="0 0 68 68"><circle cx="34" cy="34" r="26" fill="none" stroke="var(--line)" stroke-width="8"/>'+
   '<circle cx="34" cy="34" r="26" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+(v*C).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 34 34)"/>'+
   '<text x="34" y="39" text-anchor="middle" font-size="15" font-weight="800" fill="var(--text)">'+Math.round(v*100)+'%</text></svg>';
}

function hero(){
  const ws=weekStats(curWeek),pl=planned(),plTot=sum(pl),dn=sum(ws.hrs),p=ws.tot?ws.done/ws.tot:0,st=streak();
  return '<div class="hero"><div class="row">'+ring(p)+'<div class="grow"><div class="big">This week</div>'+
    '<div class="sub">'+ws.done+' of '+ws.tot+' study blocks done</div>'+
    '<div class="chips"><span class="chip"><b>'+fmtH(dn)+'</b> / '+fmtH(plTot)+' hrs</span>'+
    '<span class="chip">Streak <b>'+st+'</b> day'+(st===1?"":"s")+'</span></div></div></div></div>';
}

function dayView(){
  const isToday=selDay===todayKey;
  let h=hero();
  h+='<div class="days">'+DAYS.map(d=>{
    const s=dayStats(curWeek,d),p=s.tot?Math.round(100*s.done/s.tot):0;
    return '<button class="day '+(d===selDay?'on ':'')+(d===todayKey?'today':'')+'" data-a="day" data-k="'+d+'"><div class="n">'+d+'</div><div class="p">'+p+'%</div></button>';
  }).join('')+'</div>';
  const blocks=SCHED[selDay]||[];
  let curIdx=-1,nextIdx=-1;
  if(isToday){const nh=nowH();blocks.forEach((b,i)=>{if(H(b.s)<=nh&&nh<H(b.e))curIdx=i;else if(H(b.s)>nh&&nextIdx<0)nextIdx=i;});
    const b=blocks[curIdx>=0?curIdx:nextIdx];
    if(b)h+='<div class="card now"><div class="k">'+(curIdx>=0?'Right now':'Up next')+'</div><div class="v">'+esc(b.l)+'</div><div class="sub">'+rng(b.s,b.e)+'</div></div>';
    else h+='<div class="card now"><div class="k">Day finished</div><div class="v">Rest up. Tomorrow you go again.</div></div>';}
  const st=dayStats(curWeek,selDay);
  if(st.tot&&st.done===st.tot)h+='<div class="done-msg">Day complete. Every block ticked. 🔥</div>';
  const w=S.weeks[curWeek]||{};
  h+=blocks.map((b,i)=>{
    const t=rng(b.s,b.e)+' · '+fmtH(dur(b))+' hr'+(dur(b)===1?'':'s');
    if(!isStudy(b.c))return '<div class="rest">'+(b.c==="nap"?"😴":"🌙")+' <span>'+t+' · '+esc(b.l)+'</span></div>';
    const done=!!w[selDay+"@"+b.s];
    return '<div class="blk '+(done?'done ':'')+(i===curIdx?'cur':'')+'" style="--c:var(--'+b.c+')" data-a="toggle" data-k="'+selDay+'|'+b.s+'">'+
      '<span class="chk">✓</span><div class="grow"><div class="tm">'+t+'</div><div class="lb">'+esc(b.l)+'</div></div><span class="tag">'+CAT[b.c]+'</span></div>';
  }).join('');
  return h;
}

function progressView(){
  let h=hero();
  h+='<div class="card"><h3>Completion by day</h3><div class="bars">'+DAYS.map(d=>{
    const s=dayStats(curWeek,d),p=s.tot?s.done/s.tot:0;
    return '<div class="bar '+(d===todayKey?'today':'')+'"><i style="height:'+Math.max(3,Math.round(p*100))+'%"></i><span>'+d.slice(0,1)+d.slice(1,3).toLowerCase()+'</span></div>';
  }).join('')+'</div></div>';
  const ws=weekStats(curWeek),pl=planned();
  h+='<div class="card"><h3>Hours studied vs planned</h3>'+Object.keys(CAT).filter(k=>pl[k]).map(k=>{
    const d=ws.hrs[k]||0,p=pl[k],pc=Math.min(100,Math.round(100*d/p));
    return '<div class="cat" style="--c:var(--'+k+')"><div class="h"><span>'+CAT[k]+'</span><span>'+fmtH(d)+' / '+fmtH(p)+' hrs</span></div><div class="track"><i style="width:'+pc+'%"></i></div></div>';
  }).join('')+'</div>';
  h+='<div class="card"><h3>Cisco JCA modules finished (all time)</h3><div class="counter"><button class="btn" data-a="modminus">−</button><div class="num">'+S.modules+'</div><button class="btn pri" data-a="modplus">+</button><div class="sub grow">Tap + each time you finish a module.</div></div></div>';
  const hist=[];
  for(let i=1;i<=4;i++){const m=new Date(mondayOf(SD));m.setDate(m.getDate()-7*i);const k=ds(m);const s=weekStats(k);
    if(s.done>0){const e=new Date(m);e.setDate(e.getDate()+6);
      const f=d=>d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
      hist.push('<div class="hist"><span>'+f(m)+' – '+f(e)+'</span><b>'+Math.round(100*s.done/s.tot)+'%</b></div>');}}
  if(hist.length)h+='<div class="card"><h3>Previous weeks</h3>'+hist.join('')+'</div>';
  h+='<div class="foot">Saved on this device only. Use Settings → Export to keep a backup.</div>';
  return h;
}

function projectsView(){
  let h=hero();
  h+='<div class="card"><h3>Log a project</h3><input id="pn" placeholder="What did you build?" maxlength="80"><textarea id="pd" placeholder="What did you learn or use? (optional)" maxlength="300"></textarea><button class="btn pri" data-a="addproj">Add project</button></div>';
  h+='<div class="card"><h3>Built so far: '+S.projects.length+'</h3>';
  if(!S.projects.length)h+='<div class="sub">Nothing yet. Your first one can be tiny, like a script that counts failed logins.</div>';
  h+=S.projects.map(p=>'<div class="proj"><div class="t">'+esc(p.t)+'</div>'+(p.n?'<div class="n">'+esc(p.n)+'</div>':'')+'<div class="d">'+esc(p.d)+' · <button class="link" data-a="delproj" data-k="'+esc(p.id)+'">remove</button></div></div>').join('');
  return h+'</div>';
}

function render(){
  document.getElementById("dateLine").textContent=SD.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
  const tabs=[["day","Day"],["progress","Progress"],["projects","Projects"],["settings","Settings"]];
  const body=tab==="day"?dayView():tab==="progress"?progressView():tab==="projects"?projectsView():settingsView();
  document.getElementById("app").innerHTML='<div class="tabs">'+tabs.map(t=>'<button class="tab '+(t[0]===tab?'on':'')+'" data-a="tab" data-k="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+body;
}


/* ---------- settings, reminders, calendar file, backup ---------- */
const RS="mcjayy_settings_v1", NS="mcjayy_notified_v1";
let ST={remind:false,lead:10};
try{Object.assign(ST,JSON.parse(localStorage.getItem(RS)||"{}"));}catch(e){}
let notified={};
try{notified=JSON.parse(localStorage.getItem(NS)||"{}");}catch(e){}
let deferredInstall=null;
const saveST=()=>{try{localStorage.setItem(RS,JSON.stringify(ST));}catch(e){}};
const isInstalled=()=>(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone===true;
const canNotify=()=>"Notification" in window;
const perm=()=>canNotify()?Notification.permission:"unsupported";

async function showNote(title,body,tag){
  try{
    const reg=("serviceWorker" in navigator)?await navigator.serviceWorker.getRegistration():null;
    if(reg&&reg.showNotification){await reg.showNotification(title,{body:body,icon:"icon-192.png",badge:"icon-192.png",tag:tag||undefined});return true;}
    new Notification(title,{body:body,icon:"icon-192.png",tag:tag||undefined});return true;
  }catch(e){return false;}
}
function checkReminders(){
  if(!ST.remind||perm()!=="granted")return;
  const n=new Date(),sd=studyDay(n),day=DOW[sd.getDay()],dk=ds(sd),nh=nowH();
  const w=S.weeks[ds(mondayOf(sd))]||{};
  (SCHED[day]||[]).forEach(b=>{
    if(b.c==="wind")return;
    const diff=(H(b.s)-nh)*60,key=dk+"@"+b.s;
    if(diff<=ST.lead&&diff>-5&&!notified[key]){
      notified[key]=1;
      if(isStudy(b.c)&&w[day+"@"+b.s])return;
      const soon=diff>1?"in "+Math.round(diff)+" min":"now";
      showNote(b.c==="nap"?"Nap time "+soon:b.l+" "+soon, rng(b.s,b.e)+(b.c==="nap"?" · protect your sleep":" · tap to open your tracker"),key);
    }
  });
  const cut=ds(new Date(Date.now()-4*86400000));
  Object.keys(notified).forEach(k=>{if(k.slice(0,10)<cut)delete notified[k];});
  try{localStorage.setItem(NS,JSON.stringify(notified));}catch(e){}
}

function buildICS(){
  const idx={MON:0,TUE:1,WED:2,THU:3,FRI:4,SAT:5,SUN:6};
  const t0=new Date();t0.setHours(0,0,0,0);
  t0.setDate(t0.getDate()+((8-t0.getDay())%7));           // next Monday (today if Monday)
  const f=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";
  const e=s=>s.replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,");
  const stamp=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//McJayy//Stick Tracker//EN","CALSCALE:GREGORIAN","X-WR-CALNAME:Study Timetable"];
  let n=0;
  DAYS.forEach(day=>{
    const base=new Date(t0);base.setDate(base.getDate()+idx[day]);
    SCHED[day].forEach(b=>{
      n++;
      const s=new Date(base.getTime()+H(b.s)*3600000),en=new Date(base.getTime()+H(b.e)*3600000);
      L.push("BEGIN:VEVENT","UID:"+day+"-"+b.s.replace(":","")+"-"+n+"@stick-tracker","DTSTAMP:"+stamp,"DTSTART:"+f(s),"DTEND:"+f(en),"RRULE:FREQ=WEEKLY","SUMMARY:"+e(b.l),"DESCRIPTION:"+e(CAT[b.c]||(b.c==="nap"?"Nap":"Wind down")));
      if(b.c!=="wind")L.push("BEGIN:VALARM","TRIGGER:-PT10M","ACTION:DISPLAY","DESCRIPTION:"+e(b.l)+" in 10 minutes","END:VALARM");
      L.push("END:VEVENT");
    });
  });
  L.push("END:VCALENDAR");
  return L.join("\r\n")+"\r\n";
}
function download(name,type,text){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:type}));
  a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
}

function settingsView(){
  const p=perm(),on=ST.remind&&p==="granted";
  let h='<div class="card"><h3>Reminders</h3>';
  if(p==="unsupported")h+='<div class="sub">This browser does not support notifications. Use the calendar file below instead.</div>';
  else{
    h+='<div class="sub" style="margin-bottom:8px">'+(on?'On. You get a nudge '+ST.lead+' min before each block.':p==="denied"?'Blocked. Allow notifications for this site in your browser settings, then come back.':'Off.')+'</div>';
    h+='<div class="row" style="gap:8px;flex-wrap:wrap">';
    h+=on?'<button class="btn" data-a="remoff">Turn off</button>':(p==="denied"?'':'<button class="btn pri" data-a="remon">Turn on reminders</button>');
    if(p==="granted")h+='<button class="btn" data-a="remtest">Send test</button>';
    h+='<select id="lead" data-a="lead" class="btn">'+[5,10,15,30].map(m=>'<option value="'+m+'"'+(m===ST.lead?' selected':'')+'>'+m+' min before</option>').join('')+'</select></div>';
    h+='<div class="sub" style="margin-top:8px">These fire while the app is open or was used recently. Phones pause background apps, so for alerts you can always count on, add the calendar file below.</div>';
  }
  h+='</div>';
  h+='<div class="card"><h3>Calendar alerts (most reliable)</h3><div class="sub" style="margin-bottom:8px">Downloads your whole week as a calendar file. Open it and your phone calendar adds every block with a 10-minute alert. These fire even when this app is closed.</div><button class="btn pri" data-a="ics">Download calendar file</button></div>';
  h+='<div class="card"><h3>Install as an app</h3>';
  if(isInstalled())h+='<div class="sub">Installed. You are using it as an app.</div>';
  else{
    h+='<div class="sub" style="margin-bottom:8px">Android (Chrome): tap Install below, or menu → Install app.<br>iPhone (Safari): Share → Add to Home Screen.</div>';
    if(deferredInstall)h+='<button class="btn pri" data-a="install">Install</button>';
  }
  h+='</div>';
  h+='<div class="card"><h3>Backup</h3><div class="sub" style="margin-bottom:8px">Your progress lives on this device. Export a copy now and then, or to move it to a new phone.</div><div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn" data-a="export">Export</button><label class="btn" style="cursor:pointer">Import<input id="imp" type="file" accept="application/json,.json" style="display:none" data-a="import"></label></div></div>';
  return h;
}

document.addEventListener("change",function(ev){
  const el=ev.target.closest("[data-a]");if(!el)return;
  if(el.dataset.a==="lead"){ST.lead=+el.value||10;saveST();render();}
  else if(el.dataset.a==="import"&&el.files&&el.files[0]){
    const r=new FileReader();
    r.onload=()=>{try{const o=normalize(JSON.parse(r.result));S=o;persist();render();}catch(e){alert("That file could not be read.");}};
    r.readAsText(el.files[0]);
  }
});
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstall=e;if(tab==="settings")render();});
window.addEventListener("appinstalled",()=>{deferredInstall=null;if(tab==="settings")render();});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){checkReminders();if(tab==="day")render();}});
setInterval(checkReminders,30000);
if("serviceWorker" in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}

document.addEventListener("click",function(ev){
  const el=ev.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a,k=el.dataset.k;
  if(a==="tab"){tab=k;render();}
  else if(a==="day"){selDay=k;render();}
  else if(a==="toggle"){const p=k.split("|"),w=wk(),key=p[0]+"@"+p[1];if(w[key])delete w[key];else w[key]=1;persist();render();}
  else if(a==="modplus"){S.modules++;persist();render();}
  else if(a==="modminus"){S.modules=Math.max(0,S.modules-1);persist();render();}
  else if(a==="addproj"){
    const n=document.getElementById("pn").value.trim(),d=document.getElementById("pd").value.trim();
    if(!n)return;
    S.projects.unshift({id:String(Date.now()),t:n,n:d,d:new Date().toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})});
    S.projects=S.projects.slice(0,200);persist();render();
  }
  else if(a==="delproj"){S.projects=S.projects.filter(p=>p.id!==k);persist();render();}
  else if(a==="remon"){
    if(!canNotify())return;
    Notification.requestPermission().then(r=>{ST.remind=(r==="granted");saveST();render();if(r==="granted")showNote("Reminders are on","You'll get a nudge before each study block.","welcome");});
  }
  else if(a==="remoff"){ST.remind=false;saveST();render();}
  else if(a==="remtest"){showNote("Test reminder","If you can see this, reminders work on this device.","test");}
  else if(a==="ics"){download("Study_Timetable.ics","text/calendar",buildICS());}
  else if(a==="install"){if(deferredInstall){deferredInstall.prompt();deferredInstall=null;render();}}
  else if(a==="export"){download("stick-tracker-backup.json","application/json",JSON.stringify(S,null,2));}
  else if(a==="theme"){const r=document.documentElement;const dark=getComputedStyle(r).getPropertyValue("--bg").trim()==="#0b1320";r.setAttribute("data-theme",dark?"light":"dark");}
});

render();

checkReminders();
</script>
